services:
  - type: web
    name: REPLACE_WITH_BOT_NAME
    env: python
    region: frankfurt
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: python -u main.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        sync: false
      - key: ADMIN_USER_ID
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: AI_MODEL
        value: openai/gpt-oss-20b
      - key: TZ
        value: Europe/Moscow
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PORT
        value: "8080"
